# Post-deploy verification. This workflow runs AFTER a deploy has already gone live and
# MUST NOT be made a required status check or a `needs:` of any deploy job - a red run
# here must never block or roll back a deployment.
name: E2E Tests

on:
  # Runs after a deploy completes. A workflow may declare only one `workflow_run` key,
  # so both deploy workflows are listed here; the matrix below picks the environment.
  workflow_run:
    workflows: ["N2A - Build and Push", "N1 - Build and Push"]
    types: [completed]
    branches: [develop, 'release/*']

  # Nightly schedule (UTC) — 6 AM UTC = ~1-2 AM ET. Catches environment drift
  # (expired test-account passwords, cert rotation, MCP outages) between deploys.
  schedule:
    - cron: '0 6 * * *'

  # Manual trigger for debugging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        type: choice
        options:
          - n2a
          - n1
          - prod
      test_branch:
        description: 'Branch to check out test code from (defaults to develop)'
        required: false
        default: 'develop'
        type: string

# Serialize runs so overlapping deploys don't collide on the shared test account.
concurrency:
  group: e2e-tests-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E Smoke Tests (${{ matrix.environment }})
    runs-on: paychex-ai-platform-arc-nonprod
    # Skip if the triggering workflow failed (workflow_run)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # No browser download; the gate itself runs in seconds.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.environment) ||
          github.event.workflow_run.name == 'N1 - Build and Push' && '["n1"]' ||
          github.event_name == 'workflow_run' && '["n2a"]' ||
          '["n2a", "n1"]'
          ) }}

    env:
      E2E_BASE_URL: ${{ matrix.environment == 'prod' && 'https://play.ai.paychex.com' || matrix.environment == 'n1' && 'https://play.ain1.paychex.com' || 'https://play.ain2a.paychex.com' }}
      E2E_USERNAME: ${{ matrix.environment == 'prod' && 'libre_playwright_pr@paychex.com' || 'libre_playwright_np@paychex.com' }}
      E2E_PASSWORD: ${{ matrix.environment == 'prod' && secrets.LIBRE_PLAYWRIGHT_PR_PASSWORD || secrets.LIBRE_PLAYWRIGHT_NP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_branch || github.event.workflow_run.head_branch || 'develop' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-ci-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bash scripts/ci-npm-install.sh

      - name: Save node_modules cache
        if: always() && steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-ci-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}

      - name: Restore Playwright browser cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `playwright install chromium` installs ONLY the headed browser; the shell that
      # `headless: true` launches is a separate target (dir name uses underscores).
      # The CLI also intermittently hangs after downloading instead of exiting, so
      # bound the attempt and verify both directories rather than the exit code.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          verify() {
            ls -d "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1 &&
            ls -d "$HOME"/.cache/ms-playwright/chromium_headless_shell-* >/dev/null 2>&1
          }
          attempt() {
            set +e
            timeout 300s npx playwright install chromium chromium-headless-shell
            status=$?
            set -e
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then return "$status"; fi
          }
          attempt || true
          if ! verify; then
            echo "::warning::Incomplete browser install, retrying once"
            attempt || true
          fi
          verify || { echo "::error::chromium_headless_shell missing after install"; exit 1; }

      - name: Install Playwright OS dependencies
        timeout-minutes: 10
        run: |
          set +e
          timeout 300s npx playwright install-deps chromium
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Save Playwright browser cache
        if: always() && steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run E2E Tests
        run: npx playwright test --config=e2e/playwright.config.ci.ts

      # always() rather than failure(): a job cancelled by timeout is not a failure,
      # and that is exactly when the report is most needed.
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.environment }}
          path: |
            e2e/playwright-report-ci/
            e2e/results-ci/
            e2e/auth-failure.png
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.environment }}
          path: e2e/test-results-ci/
          retention-days: 7
          if-no-files-found: ignore
