# Post-deploy verification. This workflow runs AFTER a deploy has already gone live and
# MUST NOT be made a required status check or a `needs:` of any deploy job - a red run
# here must never block or roll back a deployment.
name: E2E Tests

on:
  # Runs after a deploy completes. A workflow may declare only one `workflow_run` key,
  # so both deploy workflows are listed here; the matrix below picks the environment.
  workflow_run:
    workflows: ["N2A - Build and Push", "N1 - Build and Push"]
    types: [completed]
    branches: [develop, 'release/*']

  # Nightly schedule (UTC) — 6 AM UTC = ~1-2 AM ET. Catches environment drift
  # (expired test-account passwords, cert rotation, MCP outages) between deploys.
  schedule:
    - cron: '0 6 * * *'

  # Manual trigger for debugging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        type: choice
        options:
          - n2a
          - n1
          - prod
      test_branch:
        description: 'Branch to check out test code from (defaults to develop)'
        required: false
        default: 'develop'
        type: string
      suite:
        description: 'Which suite to run'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - journeys
          - probe

# Serialize runs so overlapping deploys don't collide on the shared test account.
# ref_name is the short form, so a scheduled run lands in the same group as a
# deploy-triggered run on the same branch.
concurrency:
  group: e2e-tests-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E Smoke Tests (${{ matrix.environment }})
    runs-on: paychex-ai-platform-arc-nonprod
    # Skip if the triggering workflow failed (workflow_run)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Cold-cache runs pay the full browser download; warm runs finish in ~2 min.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.environment) ||
          github.event.workflow_run.name == 'N1 - Build and Push' && '["n1"]' ||
          github.event_name == 'workflow_run' && '["n2a"]' ||
          '["n2a", "n1"]'
          ) }}

    env:
      E2E_BASE_URL: ${{ matrix.environment == 'prod' && 'https://play.ai.paychex.com' || matrix.environment == 'n1' && 'https://play.ain1.paychex.com' || 'https://play.ain2a.paychex.com' }}
      E2E_USERNAME: ${{ matrix.environment == 'prod' && 'libre_playwright_pr@paychex.com' || 'libre_playwright_np@paychex.com' }}
      E2E_PASSWORD: ${{ matrix.environment == 'prod' && secrets.LIBRE_PLAYWRIGHT_PR_PASSWORD || secrets.LIBRE_PLAYWRIGHT_NP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_branch || github.event.workflow_run.head_branch || 'develop' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Pinned to 20: Playwright 1.56's installer hangs during extraction under
          # Node 24.16.0 on these runners. The same command installs in 10s on Node 20.
          node-version: '20'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-ci-${{ runner.os }}-20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        id: install-deps
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bash scripts/ci-npm-install.sh

      # Gated on install success: a partial node_modules must never be cached, or
      # every later run restores the broken state and skips the install entirely.
      - name: Save node_modules cache
        if: steps.install-deps.outcome == 'success' && steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-ci-${{ runner.os }}-20-${{ hashFiles('package-lock.json') }}

      - name: Restore Playwright browser cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Plain install: on Node 20 this lands both chromium and the headless shell.
      # Verify the executable itself, not the directory - a truncated install leaves
      # the directory behind, so only the missing binary reveals it.
      - name: Install Playwright browsers
        id: install-browsers
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          test -x "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-linux/headless_shell

      # Best-effort: this shells out to apt and fails intermittently on the ARC
      # runners, but chromium_headless_shell runs without the full dependency set
      # (Playwright only warns). A flaky apt mirror must not fail a deploy check.
      - name: Install Playwright OS dependencies
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install-deps chromium

      # Gated on the install step, not always(): a truncated install must never be
      # cached, or every later run restores the broken state.
      - name: Save Playwright browser cache
        if: steps.install-browsers.outcome == 'success' && steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run E2E Tests
        # Passed through env rather than interpolated into the script body.
        env:
          SUITE: ${{ github.event.inputs.suite || 'ci' }}
        run: npx playwright test --config="e2e/playwright.config.$SUITE.ts"

      # always() rather than failure(): a job cancelled by timeout is not a failure,
      # and that is exactly when the report is most needed.
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.environment }}
          path: |
            e2e/playwright-report-ci/
            e2e/results-ci/
            e2e/playwright-report-journeys/
            e2e/results-journeys/
            e2e/results-probe/
            e2e/auth-failure.png
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.environment }}
          path: |
            e2e/test-results-ci/
            e2e/test-results-journeys/
            e2e/test-results-probe/
          retention-days: 7
          if-no-files-found: ignore
